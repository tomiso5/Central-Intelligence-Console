<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vauxhall Terminal — an open-source, spy-themed personal operations dashboard built on public data and your own accounts.">
<meta name="theme-color" content="#0C131D">
<title>Vauxhall Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230C131D'/%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23C8A35A' stroke-width='6'/%3E%3Ctext x='50' y='66' text-anchor='middle' fill='%23E2C68C' font-family='Georgia' font-weight='700' font-size='46'%3EV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<script src="config.js"></script>
</head>
<body>
<div id="boot" role="dialog" aria-labelledby="bootTitle">
  <div class="bootcard">
    <svg class="crest" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="39"/>
      <path d="M50 4 L50 14 M50 86 L50 96 M4 50 L14 50 M86 50 L96 50"/>
      <text x="50" y="61" text-anchor="middle">V</text>
    </svg>
    <h1 id="bootTitle">Vauxhall Terminal</h1>
    <p>Personal operations dashboard. Your data stays in this browser.</p>
    <form class="bootform" id="bootForm" autocomplete="off">
      <label class="sr" for="callsign">Callsign</label>
      <input class="i" id="callsign" maxlength="24" placeholder="Choose your callsign, e.g. KESTREL" required>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    <div class="bootlog" id="bootLog" aria-live="polite"></div>
  </div>
</div>

<div class="app">
  <div class="classbar"><span>OFFICIAL-SENSITIVE · FICTIONAL TERMINAL</span><span id="utc">--:--:-- UTC</span></div>
  <header class="top">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="#C8A35A" stroke-width="5"/><text x="50" y="66" text-anchor="middle" fill="#E2C68C" font-family="Bodoni Moda,Georgia,serif" font-weight="700" font-size="48">V</text></svg>
      <div><b>Vauxhall Terminal</b><small>Personal operations dashboard</small></div></div>
    <div class="clocks" id="clocks"></div>
    <div class="threat" id="threatBox"><span class="l">UK threat level</span><span class="v"><span id="threatLvl">—</span><span class="bars"><i></i><i></i><i></i><i></i><i></i></span></span></div>
    <div class="agent"><div class="badge" id="agentBadge">?</div><div><div class="who" id="agentName">—</div><div class="st" id="agentSt">Connections: checking…</div></div></div>
  </header>
  <div class="body">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <main id="main"></main>
  </div>
  <div class="ticker" aria-label="Headlines"><div class="lab">Flash</div><div class="rail2"><div class="track" id="ticker"></div></div></div>
</div>
<div class="maptip" id="maptip"></div>
<noscript><p style="padding:20px">Vauxhall Terminal needs JavaScript.</p></noscript>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
